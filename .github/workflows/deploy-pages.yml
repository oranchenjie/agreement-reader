name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个部署；新的推送排队而不是并行
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 本项目零第三方依赖，不需要 npm install
      - name: 运行测试
        run: npm test

      - name: 构建静态站点
        run: npm run build:static

      # 部署前先确认产物里没有 404 —— 静态站点最典型的事故
      # 就是某个模块没被构建进去，用户点到那个功能才发现
      - name: 检查静态产物可达性
        run: npm run check:static

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
